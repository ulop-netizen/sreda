name: post-to-threads

on:
  schedule:
    # 7 posts/day at 06/09/11/13/15/17/19:00 Warsaw (VAC 26.10).
    # CET (UTC+1, since 25.10) → UTC 05/08/10/12/14/16/18:00.
    # Summer (CEST, from 29.03.2027) would fire 1h later in Warsaw — shift the hours then.
    # :30 catch-up ticks for late/missed GitHub cron runs; SLOT_MODE skips a slot already posted,
    # MIN_GAP_HOURS=1.5 stops bunching.
    - cron: "0 5,8,10,12,14,16,18 * * *"
    - cron: "30 5,8,10,12,14,16,18 * * *"
  workflow_dispatch: {}   # кнопка ручного запуска
  # Backup trigger #1: any push to main that changes the trigger file.
  # posted_log commits never touch this path (and GITHUB_TOKEN pushes don't trigger runs), so no loop.
  push:
    branches: [main]
    paths: ["flowers/content/trigger/backup.txt"]
  # Backup trigger #2: creating a branch named backup-* (e.g. via the GitHub connector's create_branch).
  # Only repo writers can create branches. The run deletes that branch at the end.
  create:

permissions:
  contents: write         # чтобы коммитить posted_log.json обратно

jobs:
  post:
    runs-on: ubuntu-latest
    concurrency: post-to-threads
    if: github.event_name != 'create' || (github.event.ref_type == 'branch' && startsWith(github.event.ref, 'backup-'))
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r flowers/requirements.txt

      - name: Publish
        working-directory: flowers
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/ulop-netizen/sreda/main/flowers/images
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
          SLOT_MODE: "1"
        run: python -m src.post

      - name: Save posted log
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add flowers/content/posted_log.json
          git diff --cached --quiet || git commit -m "log: posted $(date -u +%FT%TZ)"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Delete backup trigger branch
        if: always() && github.event_name == 'create'
        run: git push origin --delete "${{ github.event.ref }}" || true
