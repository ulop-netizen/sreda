name: post-to-threads

on:
  schedule:
    # 3 posts/day at ~08:10 / 11:10 / 18:10 Warsaw.
    # Oct = CEST (UTC+2) → UTC: 06:10 / 09:10 / 16:10.
    # Winter (UTC+1): would fire ~07:10 / 10:10 / 17:10 — adjust when clocks change.
    - cron: "10 6 * * *"
    - cron: "10 9 * * *"
    - cron: "10 16 * * *"
  workflow_dispatch: {}   # кнопка ручного запуска

permissions:
  contents: write         # чтобы коммитить posted_log.json обратно

jobs:
  post:
    runs-on: ubuntu-latest
    concurrency: post-to-threads
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r flowers/requirements.txt

      - name: Publish
        working-directory: flowers
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/ulop-netizen/sreda/main/flowers/images
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
        run: python -m src.post

      - name: Save posted log
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add flowers/content/posted_log.json
          git diff --cached --quiet || git commit -m "log: posted $(date -u +%FT%TZ)"
          git push
