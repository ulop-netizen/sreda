name: post-to-threads

on:
  schedule:
    # Время в UTC. Ниже ~ 09:00 / 12:00 / 15:00 / 18:00 / 21:00 по Варшаве (лето, UTC+2).
    - cron: "0 7 * * *"
    - cron: "0 10 * * *"
    - cron: "0 13 * * *"
    - cron: "0 16 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch: {}   # кнопка ручного запуска

permissions:
  contents: write         # чтобы коммитить posted_log.json обратно

jobs:
  post:
    runs-on: ubuntu-latest
    concurrency: post-to-threads   # не запускать два раза параллельно
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Publish
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
        run: python -m src.post

      - name: Save posted log
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add content/posted_log.json
          git diff --cached --quiet || git commit -m "log: posted $(date -u +%FT%TZ)"
          git push
