  # ---------- ТЕКСТ (RU, охваты) ----------
  - id: txt-buket-sebe
    caption: |
      Букет себе, без повода — это норма или перебор?
      Моё мнение: норма. Но интересно, что скажете вы 👇

  - id: txt-pochemu-cena
    caption: |
      Почему авторский букет стоит 250, а не 100:
      гортензия на оптовке — 20 zł/шт, антуриум — 12, плюс зелень, упаковка, доставка по Варшаве и час работы руками.
      Это не наценка с потолка.

  - id: txt-uhod
    caption: |
      Чтобы букет простоял неделю:
      — подрезать стебли под углом, каждый день
      — менять воду
      — убрать листья, которые в воде
      — подальше от солнца, батареи и фруктов
      Всё. Никаких таблеток и сахара.

  - id: txt-chetnoe
    caption: |
      Чётное число цветов «только на похороны» — суеверие, от которого пора избавиться.
      В остальном мире считают штуками, а не приметами. Решает композиция, а не количество.

  - id: txt-za-kadrom
    caption: |
      5 утра, оптовый рынок, холодрыга, руки в земле.
      Романтики — ноль.
      А через три часа собираешь из этого букет — и всё окупается.

  - id: txt-sezon
    caption: |
      Что сейчас в сезоне в Варшаве:
      георгины, астры, гортензия, амарант, злаки.
      Пионы — уже только импорт, дорого и недолго стоят. Не сезон.

  - id: txt-istoria
    caption: |
      Заказали букет с запиской «прости, мам».
      Собрала, отправила. Через час — «можно ещё один, теперь для бабушки».
      Люблю такие дни.

  - id: txt-tri-slova
    caption: |
      Опишите идеальный букет тремя словами.
      Соберу вариант, который наберёт больше всего откликов, и подарю автору. Варшава, доставка моя.

  - id: txt-cvet-nedeli
    caption: |
      Цветок недели в студии — георгина.
      Держит форму, цвет насыщенный, в букете «читает» издалека.
      Кому собирали георгины в последний раз? Напишите в комментариях 👇

  - id: txt-dostavka-war
    caption: |
      Доставка по Варшаве: собираю, упаковываю, везу сама.
      Без «оставим у двери через три дня» — букет доезжает свежим.
      Если нужен слот на сегодня/завтра — напишите в DM, подскажу, что реально успеть.

  - id: txt-ne-zhdi-povod
    caption: |
      Не ждите круглую дату, чтобы подарить цветы.
      «Просто так», «устала», «порадовала бы себя» — тоже поводы.
      А вы последний раз дарили букет без праздника?

