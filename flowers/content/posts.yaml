# Pula postów dla @july.concept.flowers. Rynek: Warszawa. Waluta: zł (PLN).
# Pozycjonowanie: autorska / premium florystyka.
#
# Wpis: id / image (plik w images/) / name / price_pln (albo base_pln + mnożnik)
#       caption – (opcjonalnie) własny pełny tekst zamiast szablonu

defaults:
  price_multiplier: 1.8
  cta: "DM to order or customize your own!"
  template: |
    {name}
    Price: {price}
    Available for order in Warsaw 📍
    {cta}

posts:
