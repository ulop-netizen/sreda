# Pula postów dla @july.concept.flowers. Rynek: #Warszawa.
# Новые фото-посты — польский + русский, без цены, пока нет price_pln.
# Уже опубликованные подписи не переписывать.
#
# Wpis: id / image (plik w images/) / name / price_pln
#       caption – (opcjonalnie) własny pełny tekst zamiast szablonu
# Текстовый пост = запись без image, только id + caption.

defaults:
  price_multiplier: 1.8
  cta: "Napisz w DM — zamówienie lub własna kompozycja.\nНапишите в DM — заказ или свой вариант."
  template: |
    {name}
    {price_line}
    Na zamówienie #Warszawa 📍
    На заказ #Warszawa
    {cta}

