# Pool for @july.concept.flowers — studio location: WARSAW only (#Warszawa).
# Batch posts: ONE language per caption — full RU or full PL (no English), strictly
# alternating RU, PL, RU, PL… in queue order. #Warszawa, no prices, DM CTA in that language.
# Dedupe = caption fingerprint OR id (see src/content.py) — never change ids of
# already-published entries.
#
# Entry: id / image (file under images/) / name / optional caption / optional price_pln
# Text-only = id + caption, no image.

defaults:
  price_multiplier: 1.8
  cta: "Napisz w DM, żeby zamówić."
  template: |
    {name}
    {price_line}
    Na zamówienie w Warszawie 📍 #Warszawa
    {cta}

