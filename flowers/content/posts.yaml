# Pula postów dla @july.concept.flowers. Rynek: Warszawa.
# Фото-посты — англ., премиум. Текстовые — рус., для охватов/вовлечения.
#
# Wpis: id / image (plik w images/) / name / price_pln
#       caption – (opcjonalnie) własny pełny tekst zamiast szablonu
# Текстовый пост = запись без image, только id + caption.

defaults:
  price_multiplier: 1.8
  cta: "DM to order or customize your own!"
  template: |
    {name}
    Price: {price}
    Available for order in Warsaw 📍
    {cta}

posts:
  # ---------- ФОТО (EN, премиум) ----------
  - id: crimson-drama
    image: crimson-drama.jpg
    price_pln: 320
    name: "Crimson still life — strawflower, anthurium, smokebush 🍷"

  - id: green-cascade
    image: green-cascade.jpg
    price_pln: 300
    name: "Chartreuse cascade — bells of Ireland & hanging amaranth 🌿"

  - id: calla-line
    image: calla-line.jpg
    price_pln: 340
    name: "Peach calla lilies, drawn out in a line ✨"

  - id: blush-anthurium
    image: blush-anthurium.jpg
    price_pln: 290
    name: "Blush hydrangea & pink anthurium 🌸"

  - id: dahlia-ember
    image: dahlia-ember.jpg
    price_pln: 300
    name: "Ember dahlias on burgundy hydrangea 🔥"

  - id: ranunculus-carnival
    image: ranunculus-carnival.jpg
    price_pln: 300
    name: "Ranunculus carnival — orange, pink, yellow 🎪"

  - id: soft-morning
    image: soft-morning.jpg
    price_pln: 260
    name: "Soft morning — cream gerbera, spray roses, blue tweedia ☁️"

  - id: autumn-pocket
    image: autumn-pocket.jpg
    price_pln: 180
    name: "Pocket bouquet in autumn tones 🍂"

  - id: ranunculus-vase
    image: ranunculus-vase.jpg
    price_pln: 320
    name: "Ranunculus & chamomile in a ceramic vase 🤍"

  - id: peonies-coral
    image: peonies-coral.jpg
    price_pln: 1290
    name: "Coral peonies — oversized statement bouquet 🌷"

  - id: roses-letters
    image: roses-letters.jpg
    caption: |
      Red rose letter boxes — spell your word or date 🌹
      Price: from 490 zł / box
      Available for order in Warsaw 📍
      DM to order or customize your own!

  # ---------- ТЕКСТ (RU, охваты) ----------
  - id: txt-buket-sebe
    caption: |
      Букет себе, без повода — это норма или перебор?
      Моё мнение: норма. Но интересно, что скажете вы 👇

  - id: txt-pochemu-cena
    caption: |
      Почему авторский букет стоит 250, а не 100:
      гортензия на оптовке — 20 zł/шт, антуриум — 12, плюс зелень, упаковка, доставка по Варшаве и час работы руками.
      Это не наценка с потолка.

  - id: txt-uhod
    caption: |
      Чтобы букет простоял неделю:
      — подрезать стебли под углом, каждый день
      — менять воду
      — убрать листья, которые в воде
      — подальше от солнца, батареи и фруктов
      Всё. Никаких таблеток и сахара.

  - id: txt-chetnoe
    caption: |
      Чётное число цветов «только на похороны» — суеверие, от которого пора избавиться.
      В остальном мире считают штуками, а не приметами. Решает композиция, а не количество.

  - id: txt-za-kadrom
    caption: |
      5 утра, оптовый рынок, холодрыга, руки в земле.
      Романтики — ноль.
      А через три часа собираешь из этого букет — и всё окупается.

  - id: txt-sezon
    caption: |
      Что сейчас в сезоне в Варшаве:
      георгины, астры, гортензия, амарант, злаки.
      Пионы — уже только импорт, дорого и недолго стоят. Не сезон.

  - id: txt-istoria
    caption: |
      Заказали букет с запиской «прости, мам».
      Собрала, отправила. Через час — «можно ещё один, теперь для бабушки».
      Люблю такие дни.

  - id: txt-tri-slova
    caption: |
      Опишите идеальный букет тремя словами.
      Соберу вариант, который наберёт больше всего откликов, и подарю автору. Варшава, доставка моя.
