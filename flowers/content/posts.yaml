# Pool for @july.concept.flowers — studio location: WARSAW only (#Warszawa).
# Batch posts: RUSSIAN ONLY (VAC, Oct 10) — no Polish, no English; no alternation.
# Captions written by Claude (looking at each photo): exactly 3 lines — hook /
# '<price> zł — <flowers>' / 'Варшава #Warszawa'. Prices = Claude entry-level test prices,
# pending VAC final approval (table: content/prices.md).
# Dedupe = caption fingerprint OR id (see src/content.py) — never change ids of
# already-published entries.
#
# Entry: id / image (file under images/) / name / optional caption / optional price_pln
# Text-only = id + caption, no image.

defaults:
  price_multiplier: 1.8
  cta: "Пишите в директ для заказа."
  template: |
    {name}
    {price_line}
    Варшава #Warszawa
    {cta}

